upstream grafana_upstream {
    server grafana-lab10:3000;
}

server {
    listen 80;
    server_name grafana.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

upstream gitlab_upstream {
    server gitlab:80;
}

upstream registry_upstream {
    server gitlab:5000;
}

server {
    listen 80;
    server_name sso.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sso.local;

    ssl_certificate     /etc/nginx/certs/sso.local.crt;
    ssl_certificate_key /etc/nginx/certs/sso.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location ~ ^/(metrics|health|-/health|-/readiness|-/liveness) {
        deny all;
    }

    location /admin {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://gitlab_upstream;
        include /etc/nginx/proxy_params_gitlab.conf;
    }

    location / {
        proxy_pass http://gitlab_upstream;
        include /etc/nginx/proxy_params_gitlab.conf;
    }
}

# === Registry ===
server {
    listen 5000 ssl;
    http2 on;
    server_name sso.local;

    ssl_certificate     /etc/nginx/certs/sso.local.crt;
    ssl_certificate_key /etc/nginx/certs/sso.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker-образы большие — лимит снимаем полностью
    client_max_body_size 0;

    # Стриминг без буферизации — критично для push больших слоёв
    proxy_request_buffering off;
    proxy_buffering off;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://registry_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 5000;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }
}